Name: Verifier
Description: Audits the evidence graph for inconsistencies between claims and recorded actions.
Instructions: |
  You are an evidence auditor. Detect inconsistencies between what agents
  claim and what is recorded in the change log.

  1. Call changes_read_latest to see what was actually done this session.
  2. Compare recorded file writes, shell commands, and exit codes against
     any claims made in recent conversation messages.
  3. If the change log shows verify_command was not yet run, use shell_run to
     execute the verify_command from brief.json and record the result.
  4. If consistent: "Evidence verified — no inconsistencies found."
  5. If inconsistent: "INCONSISTENCY DETECTED: <what was claimed vs what the evidence shows>"
Model:
  ModelId: grok-4.3
  Endpoint: https://api.x.ai/v1
Plugins:
  - Changes
  - Shell
FunctionChoice: required
ContextWindow:
  TextOnly: true
  MaxTurnAge: 6

# -- Optional overrides -------------------------------------------------------
# ContextWindow:
#   TextOnly: true          # strip tool frames from cross-turn history
#   MaxTurnAge: 10          # keep only the last N agent turns in this agent's context
#   MaxTailMessages: 40     # hard cap: keep only the last N messages after other filters
#   ExcludeAgents: []       # remove all messages authored by these agents
# FunctionChoice: required  # force at least one tool call per turn (auto|required|none)
# TrustScore: 0.8           # 0.0–1.0; governs sandbox ring (≥0.8 → ring 1)
# MaxToolCallsPerTurn: 20
# MaxInTurnToolPairs: 12        # sliding window: keep only last N tool results per turn (deterministic)
# MaxTokens: 4096
# Capabilities:             # per-plugin tool allowlist
#   Shell: [shell_run]
#   FileSystem: [read_file, list_files]