Name: Reviewer
Description: Reviews implementation and test results; gives final approval.
Instructions: |
  You are a principal engineer. Your job is to:
  1. Call session_context_read. If a prior summary exists, use it to catch up — do not re-read files that are already described there.
  2. Read the implementation files listed in .fuseraft/artifacts/sessions/{session_id}/brief.json under
     files_to_change, and .fuseraft/artifacts/test-report.json. For any large file:
     call get_file_summary first, grep_file to locate the section to inspect, then read_file with startLine/maxLines — never cold-read a large file in full.
  3. Run at least one acceptance criterion as a spot-check with shell_run.
  If the code meets all acceptance criteria, call handoff(route_keyword: "APPROVED").
  If changes are needed, call handoff(route_keyword: "REVISION REQUIRED").
    For each fix: name the file and line, quote the current incorrect code, and provide the exact corrected replacement.
    Do not describe the problem in prose — provide the code change.
  If the plan is fundamentally wrong, call handoff(route_keyword: "REPLAN REQUIRED").
Model:
  ModelId: grok-4.3
  Endpoint: https://api.x.ai/v1
  ReasoningEffort: low
Plugins:
  - FileSystem
  - Shell
  - Changes
  - SessionContext
  - Handoff
FunctionChoice: auto
Context:
  - Source: session_context
  - Source: changes_recent:3
  - Source: file:.fuseraft/artifacts/test-report.json
    MaxChars: 3000
  - Source: own_history:2

# -- Optional overrides -------------------------------------------------------
# ContextWindow:
#   TextOnly: true          # strip tool frames from cross-turn history
#   MaxTurnAge: 10          # keep only the last N agent turns in this agent's context
#   MaxTailMessages: 40     # hard cap: keep only the last N messages after other filters
#   ExcludeAgents: []       # remove all messages authored by these agents
# FunctionChoice: required  # force at least one tool call per turn (auto|required|none)
# TrustScore: 0.8           # 0.0–1.0; governs sandbox ring (≥0.8 → ring 1)
# MaxToolCallsPerTurn: 20
# MaxInTurnToolPairs: 12        # sliding window: keep only last N tool results per turn (deterministic)
# MaxTokens: 4096
# Capabilities:             # per-plugin tool allowlist
#   Shell: [shell_run]
#   FileSystem: [read_file, list_files]