name: Benchmarks
on:
  push:
    branches: [ "main" ]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: ./build.sh
    - name: Run test suite
      run: ./bin/kiwi tests/test
    - name: Run benchmarks
      run: ./bin/kiwi examples/data/heavy_pipeline
