name: .NET
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Run build.sh
      run: ./build.sh
    - name: Run test suite
      run: ./bin/kiwi tests/test
    - name: Run standard library test suite
      run: ./bin/kiwi tests/test_stdlib
    - name: Test the C# extension SDK
      run: dotnet test sdk/csharp/Kiwi.Native.Tests
    - name: Test an extension written in C#
      run: ./bin/kiwi tests/native/csharp_ext.kiwi
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Run build.ps1
      shell: pwsh
      run: ./build.ps1
    - name: Run test suite
      shell: pwsh
      run: ./bin/kiwi.exe tests/test
    - name: Run standard library test suite
      shell: pwsh
      run: ./bin/kiwi.exe tests/test_stdlib
    - name: Test the C# extension SDK
      shell: pwsh
      run: dotnet test sdk/csharp/Kiwi.Native.Tests
    - name: Test an extension written in C#
      shell: pwsh
      run: ./bin/kiwi.exe tests/native/csharp_ext.kiwi
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Run build.sh
      run: ./build.sh
    - name: Run test suite
      run: ./bin/kiwi tests/test
    - name: Run standard library test suite
      run: ./bin/kiwi tests/test_stdlib
    - name: Test the C# extension SDK
      run: dotnet test sdk/csharp/Kiwi.Native.Tests
    - name: Test an extension written in C#
      run: ./bin/kiwi tests/native/csharp_ext.kiwi
